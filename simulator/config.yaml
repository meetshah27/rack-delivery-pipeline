# Simulator configuration. All randomness flows from `seed`.
# Month numbers are 1-based from history_start (month 1 = Oct 2024).

seed: 42
history_start: 2024-10-01

# Site capacity is drawn per site from this range with the seed.
capacity_range: [800, 4000]

arrivals:
  # Poisson mean orders per day before lifts. ~50k racks over 24 months.
  base_daily_orders: 51
  q4_lift: 1.3              # Oct-Dec multiplier
  expansion_from_month: 12  # capacity expansion step-up
  expansion_factor: 1.5

durations:
  # Lognormal, given as mean/std in days. Vendor lead/transit live on vendors,
  # install on sites, burn-in here scaled for GPU rack types.
  burn_in_mean_days: 3.0
  burn_in_std_days: 1.0
  gpu_burn_in_multiplier: 2.0
  retest_mean_days: 1.5      # failed burn-in back to BURN_IN
  retest_std_days: 0.5
  decommission_mean_days: 7.0
  decommission_std_days: 3.0
  lifespan_years: [3, 5]
  early_decommission_rate: 0.02
  early_decommission_days: [60, 540]
  technicians_per_site: 12

defects:
  duplicate_rate: 0.015
  duplicate_delay_days: [1, 7]
  late_delay_days: [3, 10]          # rate is per vendor (vendors[].late_rate)
  very_late_rate: 0.002
  very_late_delay_days: [30, 60]
  out_of_order_file_rate: 0.05
  format_drift_rate: 0.10
  schema_drift_from: 2026-03-01
  schema_drift_vendor: V04
  invalid_transition_rate: 0.003
  regression_rate: 0.01
  future_dated_rate: 0.0005
  future_dated_offset_days: 365
  null_recorded_by_rate: 0.04
  missing_day: 2025-08-17           # no file lands; next day carries double volume

