[project]
name = "rack-delivery-pipeline"
version = "0.1.0"
description = "Rack lifecycle analytics pipeline: simulator, S3, Redshift Serverless, dbt, Step Functions, QuickSight."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dbt-redshift>=1.8",
    "numpy>=2.0",
    "pyarrow>=17",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "dbt-metricflow[dbt-duckdb]>=0.15",
    "mypy>=1.11",
    "pillow>=10",
    "pre-commit>=3.8",
    "pypdfium2>=4.30",
    "pytest>=8.3",
    "ruff>=0.6",
    "sqlfluff>=3.1",
    "sqlfluff-templater-dbt>=3.1",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "boto3", "boto3.*", "botocore.*", "pypdfium2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = [".*", "dbt", "infra", "out", "local"]
