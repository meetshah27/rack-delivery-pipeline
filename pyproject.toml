[project]
name = "rack-delivery-pipeline"
version = "0.1.0"
description = "Rack lifecycle analytics pipeline: simulator, S3, Redshift Serverless, dbt, Step Functions, QuickSight."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "sqlfluff>=3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = [".*", "dbt", "infra", "out", "local"]
