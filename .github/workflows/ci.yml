name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: make lint
      - name: Mypy
        run: make typecheck
      # Builds the dbt project end to end on a short simulation (local DuckDB target, no AWS).
      - name: Simulate 60 days
        run: make sim DAYS=60
      - name: dbt build (local)
        run: make dbt-local
      - name: Semantic layer (MetricFlow)
        run: make mf-validate
      - name: Pytest, dbt test, sqlfluff
        run: make test
      - name: Backfill is idempotent
        run: |
          make backfill START=2024-11-01 END=2024-11-15 | grep fct_ > run1.txt
          make backfill START=2024-11-01 END=2024-11-15 | grep fct_ > run2.txt
          cat run1.txt
          diff run1.txt run2.txt
