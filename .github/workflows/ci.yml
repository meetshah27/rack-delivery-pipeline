name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: make lint
      - name: Mypy
        run: make typecheck
      # Builds the dbt project end to end on a short simulation (local DuckDB target, no AWS).
      - name: Simulate 60 days
        run: make sim DAYS=60
      - name: dbt build (local)
        run: make dbt-local
      - name: Pytest, dbt test, sqlfluff
        run: make test
