name: rack_delivery
version: "1.0.0"
profile: rack_delivery

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Overridden by the orchestrator with the Step Functions run id.
  run_id: manual

models:
  rack_delivery:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
    ops:
      +schema: ops
      +materialized: table

seeds:
  rack_delivery:
    +schema: staging
