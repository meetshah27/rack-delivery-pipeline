models:
  - name: quarantine_rack_events
    description: >
      Events that failed a data quality check. They never enter marts.
    columns:
      - name: event_id
        description: Source event UUID.
        data_tests: [unique, not_null]
      - name: reason
        description: invalid_transition or future_dated.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [invalid_transition, future_dated]
      - name: run_id
        description: Pipeline run that quarantined the row (dbt var run_id).
        data_tests: [not_null]
      - name: quarantined_at
        description: When the row was quarantined, naive UTC.
        data_tests: [not_null]

  - name: rls_site_region
    description: >
      QuickSight row-level security rules for ds_delivery: one row per user and site_region
      they may see. A null site_region means every region (the dashboard owner).
    columns:
      - name: user_name
        description: QuickSight user name.
        data_tests: [not_null]
      - name: site_region
        description: us-west, us-east, eu-central or ap-south; null for all regions.
        data_tests:
          - accepted_values:
              arguments:
                values: [us-west, us-east, eu-central, ap-south]
